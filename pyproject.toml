[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-python-sdk"
version = "0.9.4"
description = "AstrBot (Go) Python 插件 SDK：Python 插件以 gRPC 子进程接入 Go 宿主"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.50",
    "protobuf>=7.35,<8",
]

[tool.setuptools.packages.find]
include = [
    "astrbot*",
    "aiocqhttp*",
    "botpy*",
    "mcp*",
    "slack_sdk*",
    "telegram*",
]
