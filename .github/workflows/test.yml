name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install protobuf grpcio packaging
      - name: Run SDK unit tests
        run: python tests/run_tests.py
      - name: Run full RPC coverage tests
        run: python tests/test_all_rpcs.py
      - name: Bench all RPCs
        run: |
          python tests/bench_rpcs.py --iters 100 --output rpc_bench.md
          cat rpc_bench.md >> $GITHUB_STEP_SUMMARY
